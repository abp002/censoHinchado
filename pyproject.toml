[project]
name = "censohinchado"
version = "0.1.0"
description = "Anomalías del censo electoral por municipio: altas que suben para votar y bajan después, y el censo de residentes en el extranjero"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.2",
]

[project.scripts]
censo = "censo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["censo"]
